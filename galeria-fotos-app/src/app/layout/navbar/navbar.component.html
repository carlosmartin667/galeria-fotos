<!-- Navbar Start -->
<div class="container-fluid nav-bar app-nav px-0">
  <div class="container">
    <nav class="navbar navbar-light navbar-expand-lg py-3">
      <a routerLink="/dashboard" class="navbar-brand">
        <h1 class="text-primary mb-0">Galeria<span class="text-dark">Fotos</span></h1>
      </a>

      <button
        class="navbar-toggler py-2 px-3"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#appNavbar"
        aria-controls="appNavbar"
        aria-expanded="false"
        aria-label="Abrir menu">
        <span class="fa fa-bars text-primary"></span>
      </button>

      <div class="collapse navbar-collapse" id="appNavbar">
        <div class="navbar-nav mx-auto">
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-item nav-link">Dashboard</a>
          <a *ngIf="session.isAdmin" routerLink="/clientes" routerLinkActive="active" class="nav-item nav-link">Clientes</a>
          <a routerLink="/eventos" routerLinkActive="active" class="nav-item nav-link">Eventos</a>
          <a routerLink="/fotos/evento" routerLinkActive="active" class="nav-item nav-link">Fotos</a>
          <a *ngIf="session.isAuthenticated" routerLink="/pedidos" routerLinkActive="active" class="nav-item nav-link">{{ session.isAdmin ? 'Pedidos' : 'Mis pedidos' }}</a>
          <a *ngIf="session.isAuthenticated" routerLink="/favoritos" routerLinkActive="active" class="nav-item nav-link">{{ session.isAdmin ? 'Favoritos' : 'Mis favoritos' }}</a>
          <a *ngIf="session.isAuthenticated" routerLink="/pagos" routerLinkActive="active" class="nav-item nav-link">Pagos</a>
          <a *ngIf="session.isAuthenticated" routerLink="/descargas" routerLinkActive="active" class="nav-item nav-link">Descargas</a>
          <a routerLink="/admin/perfil-publico" routerLinkActive="active" class="nav-item nav-link">Perfil publico</a>
          <a *ngIf="session.isAdmin" routerLink="/admin/mi-perfil" routerLinkActive="active" class="nav-item nav-link">Mi perfil admin</a>
          <a *ngIf="session.isUser" routerLink="/clientes/mi-perfil" routerLinkActive="active" class="nav-item nav-link">Mi perfil</a>
        </div>

        <div class="app-nav-user">
          <app-guest-badge></app-guest-badge>
          <button
            type="button"
            class="btn app-theme-toggle rounded-pill"
            (click)="themeService.toggleTheme()"
            [attr.aria-label]="themeService.getTheme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
            <i [class]="themeService.getTheme() === 'dark' ? 'fas fa-sun' : 'fas fa-moon'"></i>
            <span>{{ themeService.getTheme() === 'dark' ? 'Claro' : 'Oscuro' }}</span>
          </button>
          <span class="app-nav-name">{{ session.email || session.nombre || 'Invitado' }}</span>
          <button *ngIf="session.isAuthenticated" type="button" class="btn btn-primary rounded-pill py-2 px-4" (click)="logout()">Cerrar sesion</button>
          <a *ngIf="!session.isAuthenticated" routerLink="/login" class="btn btn-primary rounded-pill py-2 px-4">Iniciar sesion</a>
        </div>
      </div>
    </nav>
  </div>
</div>
<!-- Navbar End -->
