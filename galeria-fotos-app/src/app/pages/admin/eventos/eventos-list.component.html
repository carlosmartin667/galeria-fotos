<div class="admin-panel">
  <div class="admin-panel-header">
    <div>
      <small class="d-inline-block fw-bold text-dark text-uppercase bg-light border border-primary rounded-pill px-4 py-1 mb-2">Eventos</small>
      <h2 class="h3 mb-0">Listado</h2>
    </div>
    <a routerLink="/admin/eventos/nuevo" class="btn btn-primary rounded-pill px-4">Nuevo evento</a>
  </div>

  <div class="admin-panel-body">
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div *ngIf="!loading && eventos.length === 0" class="admin-empty">No hay eventos para mostrar.</div>

    <div *ngIf="!loading && eventos.length > 0" class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Cliente principal</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let evento of eventos; trackBy: trackById">
            <td>{{ evento.nombre }}</td>
            <td>{{ evento.fechaEventoUtc | date:'short' }}</td>
            <td>{{ evento.estado || '-' }}</td>
            <td>{{ evento.clientePrincipalId || '-' }}</td>
            <td class="text-end">
              <div class="admin-actions justify-content-end">
                <a [routerLink]="['/admin/fotos']" [queryParams]="{ eventoId: evento.id }" class="btn btn-sm btn-outline-dark rounded-pill">Fotos</a>
                <a [routerLink]="['/admin/eventos', evento.id, 'editar']" class="btn btn-sm btn-outline-primary rounded-pill">Editar</a>
                <button type="button" class="btn btn-sm btn-outline-danger rounded-pill" (click)="deleteEvento(evento)">Eliminar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
