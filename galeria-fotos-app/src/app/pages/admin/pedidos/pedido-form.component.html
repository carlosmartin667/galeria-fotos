<div class="admin-panel">
  <div class="admin-panel-header">
    <div>
      <small class="d-inline-block fw-bold text-dark text-uppercase bg-light border border-primary rounded-pill px-4 py-1 mb-2">Pedidos</small>
      <h2 class="h3 mb-0">Nuevo pedido</h2>
    </div>
    <a routerLink="/admin/pedidos" class="btn btn-outline-primary rounded-pill px-4">Volver</a>
  </div>

  <div class="admin-panel-body">
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="pedidoEvento">Evento ID</label>
        <input id="pedidoEvento" type="text" class="form-control" formControlName="eventoId">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="pedidoCliente">Cliente ID</label>
        <input id="pedidoCliente" type="text" class="form-control" formControlName="clienteId">
      </div>
      <div class="col-12">
        <label class="form-label" for="pedidoFotos">Foto IDs</label>
        <textarea id="pedidoFotos" rows="6" class="form-control" formControlName="fotoIds" placeholder="Un UUID por linea, o separados por coma"></textarea>
      </div>
      <div class="col-12 admin-actions">
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
