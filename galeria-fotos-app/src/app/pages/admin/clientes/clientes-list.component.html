<div class="admin-panel">
  <div class="admin-panel-header">
    <div>
      <small class="d-inline-block fw-bold text-dark text-uppercase bg-light border border-primary rounded-pill px-4 py-1 mb-2">Clientes</small>
      <h2 class="h3 mb-0">Listado</h2>
    </div>
    <a routerLink="/admin/clientes/nuevo" class="btn btn-primary rounded-pill px-4">Nuevo cliente</a>
  </div>

  <div class="admin-panel-body">
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div *ngIf="!loading && clientes.length === 0" class="admin-empty">No hay clientes para mostrar.</div>

    <div *ngIf="!loading && clientes.length > 0" class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>Documento</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of clientes; trackBy: trackById">
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.telefono || '-' }}</td>
            <td>{{ cliente.documento || '-' }}</td>
            <td class="text-end">
              <div class="admin-actions justify-content-end">
                <a [routerLink]="['/admin/clientes', cliente.id, 'editar']" class="btn btn-sm btn-outline-primary rounded-pill">Editar</a>
                <button type="button" class="btn btn-sm btn-outline-danger rounded-pill" (click)="deleteCliente(cliente)">Eliminar</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
