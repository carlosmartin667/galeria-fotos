<div class="admin-panel">
  <div class="admin-panel-header">
    <div>
      <small class="d-inline-block fw-bold text-dark text-uppercase bg-light border border-primary rounded-pill px-4 py-1 mb-2">Clientes</small>
      <h2 class="h3 mb-0">{{ isEdit ? 'Editar cliente' : 'Nuevo cliente' }}</h2>
    </div>
    <a routerLink="/admin/clientes" class="btn btn-outline-primary rounded-pill px-4">Volver</a>
  </div>

  <div class="admin-panel-body">
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="clienteNombre">Nombre</label>
        <input id="clienteNombre" type="text" class="form-control" formControlName="nombre">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="clienteEmail">Email</label>
        <input id="clienteEmail" type="email" class="form-control" formControlName="email">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="clienteTelefono">Telefono</label>
        <input id="clienteTelefono" type="text" class="form-control" formControlName="telefono">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="clienteDocumento">Documento</label>
        <input id="clienteDocumento" type="text" class="form-control" formControlName="documento">
      </div>
      <div class="col-12 admin-actions">
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
