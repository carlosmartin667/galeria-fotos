<div class="admin-panel">
  <div class="admin-panel-header">
    <div>
      <small class="d-inline-block fw-bold text-dark text-uppercase bg-light border border-primary rounded-pill px-4 py-1 mb-2">API</small>
      <h2 class="h3 mb-0">Login</h2>
    </div>
  </div>

  <div class="admin-panel-body">
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="loginEmail">Email</label>
        <input id="loginEmail" type="email" class="form-control" formControlName="email">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="loginPassword">Password</label>
        <input id="loginPassword" type="password" class="form-control" formControlName="password">
      </div>
      <div class="col-12 admin-actions">
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Iniciar sesion
        </button>
        <button type="button" class="btn btn-outline-dark rounded-pill px-4" (click)="logout()">Eliminar token</button>
      </div>
    </form>
  </div>
</div>
