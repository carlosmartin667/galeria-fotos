<div class="container-fluid nav-bar">
  <div class="container">
    <nav class="navbar navbar-light navbar-expand-lg py-4">
      <a routerLink="/" class="navbar-brand">
        <h1 class="text-primary fw-bold mb-0">Cater<span class="text-dark">Serv</span></h1>
      </a>
      <button class="navbar-toggler py-2 px-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="fa fa-bars text-primary"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <div class="navbar-nav mx-auto">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item nav-link">Home</a>
          <a routerLink="/about" routerLinkActive="active" class="nav-item nav-link">About</a>
          <a routerLink="/services" routerLinkActive="active" class="nav-item nav-link">Services</a>
          <a routerLink="/events" routerLinkActive="active" class="nav-item nav-link">Events</a>
          <a routerLink="/menu" routerLinkActive="active" class="nav-item nav-link">Menu</a>
          <a routerLink="/admin" routerLinkActive="active" class="nav-item nav-link">Gestion</a>
          <div class="nav-item dropdown">
            <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a>
            <div class="dropdown-menu bg-light">
              <a routerLink="/book" routerLinkActive="active" class="dropdown-item">Booking</a>
              <a routerLink="/blog" routerLinkActive="active" class="dropdown-item">Our Blog</a>
              <a routerLink="/team" routerLinkActive="active" class="dropdown-item">Our Team</a>
              <a routerLink="/testimonial" routerLinkActive="active" class="dropdown-item">Testimonial</a>
              <a routerLink="/not-found" routerLinkActive="active" class="dropdown-item">404 Page</a>
            </div>
          </div>
          <a routerLink="/contact" routerLinkActive="active" class="nav-item nav-link">Contact</a>
        </div>
        <button class="btn-search btn btn-primary btn-md-square me-4 rounded-circle d-none d-lg-inline-flex" type="button" data-bs-toggle="modal" data-bs-target="#searchModal" aria-label="Search">
          <i class="fas fa-search"></i>
        </button>
        <a routerLink="/book" class="btn btn-primary py-2 px-4 d-none d-xl-inline-block rounded-pill">Book Now</a>
      </div>
    </nav>
  </div>
</div>

<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content rounded-0">
      <div class="modal-header">
        <h5 class="modal-title" id="searchModalLabel">Search by keyword</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body d-flex align-items-center">
        <div class="input-group w-75 mx-auto d-flex">
          <input type="search" class="form-control bg-transparent p-3" placeholder="keywords" aria-describedby="search-icon-1">
          <span id="search-icon-1" class="input-group-text p-3"><i class="fa fa-search"></i></span>
        </div>
      </div>
    </div>
  </div>
</div>
