<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Mi perfil</small>
      <h2 class="h3 mb-0">Datos de cliente</h2>
    </div>
  </div>

  <div class="app-panel-body">
    <app-error-alert [message]="error"></app-error-alert>
    @if (success) {
      <div class="alert alert-success">{{ success }}</div>
    }
    @if (loading) {
      <app-loading></app-loading>
    }
    @if (!loading && !cliente && !error) {
      <app-empty-state text="No hay perfil para mostrar."></app-empty-state>
    }

    @if (!loading && cliente) {
      <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3" novalidate>
        <div class="col-md-6">
          <label class="form-label" for="perfilNombre">Nombre</label>
          <input id="perfilNombre" type="text" class="form-control" formControlName="nombre" />
          @if (showError('nombre')) {
            <small class="text-danger">El nombre es requerido.</small>
          }
        </div>
        <div class="col-md-6">
          <label class="form-label" for="perfilEmail">Email</label>
          <input id="perfilEmail" type="email" class="form-control" formControlName="email" />
          @if (showError('email')) {
            <small class="text-danger">Ingresa un email valido.</small>
          }
        </div>
        <div class="col-md-6">
          <label class="form-label" for="perfilTelefono">Telefono</label>
          <input id="perfilTelefono" type="text" class="form-control" formControlName="telefono" />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="perfilDocumento">Documento</label>
          <input
            id="perfilDocumento"
            type="text"
            class="form-control"
            formControlName="documento"
          />
        </div>
        <div class="col-12 app-actions">
          <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="saving">
            @if (saving) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Guardar cambios
          </button>
          <button
            type="button"
            class="btn btn-outline-danger rounded-pill px-4"
            (click)="deleteProfile()"
          >
            Eliminar perfil
          </button>
        </div>
      </form>
    }
  </div>
</div>
