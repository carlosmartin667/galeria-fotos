<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Eventos</small>
      <h2 class="h3 mb-0">{{ isEdit ? 'Editar evento' : 'Crear evento' }}</h2>
    </div>
    <a routerLink="/eventos" class="btn btn-outline-primary rounded-pill px-4">Cancelar</a>
  </div>

  <div class="app-panel-body">
    <app-error-alert [message]="error"></app-error-alert>
    <app-loading *ngIf="loading"></app-loading>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="row g-3" novalidate>
      <div class="col-md-6">
        <label class="form-label" for="eventoNombre">Nombre</label>
        <input id="eventoNombre" type="text" class="form-control" formControlName="nombre">
        <small *ngIf="showError('nombre')" class="text-danger">El nombre es requerido.</small>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="eventoFecha">Fecha</label>
        <input id="eventoFecha" type="datetime-local" class="form-control" formControlName="fechaEventoUtc">
        <small *ngIf="showError('fechaEventoUtc')" class="text-danger">La fecha es requerida.</small>
      </div>
      <div class="col-md-6" *ngIf="isEdit">
        <label class="form-label" for="eventoEstado">Estado</label>
        <select id="eventoEstado" class="form-select" formControlName="estado">
          <option *ngFor="let estado of estadoOptions" [value]="estado">{{ estado }}</option>
        </select>
        <small *ngIf="showError('estado')" class="text-danger">El estado es requerido.</small>
      </div>
      <div class="col-md-6" *ngIf="!isEdit">
        <label class="form-label" for="eventoEstadoNuevo">Estado</label>
        <select id="eventoEstadoNuevo" class="form-select" formControlName="estado">
          <option *ngFor="let estado of estadoOptions" [value]="estado">{{ estado }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="eventoVisibilidad">Visibilidad</label>
        <select id="eventoVisibilidad" class="form-select" formControlName="visibilidad">
          <option *ngFor="let visibilidad of visibilidadOptions" [value]="visibilidad">{{ visibilidad }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="eventoFechaLimite">Fecha limite de compra</label>
        <input id="eventoFechaLimite" type="datetime-local" class="form-control" formControlName="fechaLimiteCompraUtc">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="eventoCliente">Cliente principal ID</label>
        <input id="eventoCliente" type="text" class="form-control" formControlName="clientePrincipalId">
      </div>
      <div class="col-md-6" *ngIf="isEdit">
        <div class="form-check mt-md-4 pt-md-2">
          <input id="eventoActivo" type="checkbox" class="form-check-input" formControlName="activo">
          <label for="eventoActivo" class="form-check-label">Activo</label>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label" for="eventoDescripcion">Descripcion</label>
        <textarea id="eventoDescripcion" rows="4" class="form-control" formControlName="descripcion"></textarea>
      </div>
      <div class="col-12 app-actions">
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
          Guardar
        </button>
        <a routerLink="/eventos" class="btn btn-outline-dark rounded-pill px-4">Cancelar</a>
      </div>
    </form>
  </div>
</div>
