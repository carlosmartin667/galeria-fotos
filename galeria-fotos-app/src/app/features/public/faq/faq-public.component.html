<section class="public-page-hero">
  <div class="container-fluid public-wide-container">
    <small class="app-kicker">FAQ</small>
    <h1 class="display-5 mb-2">Preguntas frecuentes</h1>
    <p class="public-page-copy">Informacion util para reservar, comprar fotos y recibir tus recuerdos.</p>
  </div>
</section>

<section class="public-section">
  <div class="container-fluid public-wide-container">
    <div class="row g-3 align-items-end mb-4">
      <div class="col-lg-8">
        <label class="form-label" for="faqSearch">Buscar</label>
        <input id="faqSearch" type="search" class="form-control" [(ngModel)]="searchTerm" placeholder="Pregunta, respuesta o categoria">
      </div>
      <div class="col-lg-4">
        <label class="form-label" for="faqCategory">Categoria</label>
        <select id="faqCategory" class="form-select" [(ngModel)]="category">
          <option *ngFor="let option of categories" [value]="option">{{ option }}</option>
        </select>
      </div>
    </div>

    <app-error-alert [message]="error"></app-error-alert>
    <app-loading *ngIf="loading" text="Cargando FAQ..."></app-loading>
    <app-empty-state *ngIf="!loading && filteredPreguntas.length === 0" text="No hay preguntas para mostrar."></app-empty-state>

    <div class="public-faq-list" *ngIf="!loading && filteredPreguntas.length > 0">
      <article class="public-faq-item" *ngFor="let item of filteredPreguntas; let i = index; trackBy: trackById">
        <button type="button" class="public-faq-question" (click)="toggle(item, i)" [attr.aria-expanded]="isOpen(item, i)">
          <span>{{ item.pregunta }}</span>
          <i [class]="isOpen(item, i) ? 'fas fa-minus' : 'fas fa-plus'"></i>
        </button>
        <div class="public-faq-answer" [ngClass]="{ open: isOpen(item, i) }">
          <p>{{ item.respuesta }}</p>
          <small *ngIf="item.categoria" class="app-meta">{{ item.categoria }}</small>
        </div>
      </article>
    </div>
  </div>
</section>
