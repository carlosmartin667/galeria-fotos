<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Admin</small>
      <h2 class="h3 mb-0">Dashboard admin</h2>
    </div>
    <button type="button" class="btn btn-outline-primary rounded-pill px-4" (click)="load()">Actualizar</button>
  </div>

  <div class="app-panel-body">
    <app-error-alert [message]="error"></app-error-alert>
    <app-loading *ngIf="loading" text="Cargando dashboard admin..."></app-loading>

    <ng-container *ngIf="!loading">
      <div class="admin-metrics-grid" *ngIf="metrics.length > 0">
        <article class="dashboard-card admin-dashboard-card" *ngFor="let metric of metrics">
          <i [class]="metric.icon"></i>
          <span>{{ metric.label }}</span>
          <strong>{{ metric.value }}</strong>
        </article>
      </div>

      <div *ngIf="metrics.length === 0 && !error" class="alert alert-light border mb-0">
        La API no devolvio metricas para mostrar.
      </div>

      <div class="row g-4 mt-1" *ngIf="sections.length > 0">
        <section class="col-xl-4" *ngFor="let section of sections">
          <div class="admin-section">
            <h3 class="h5 mb-3">{{ section.title }}</h3>
            <article class="admin-section-item" *ngFor="let item of section.items">
              <strong>{{ itemTitle(item) }}</strong>
              <span>{{ itemMeta(item) || 'Sin detalle' }}</span>
            </article>
          </div>
        </section>
      </div>
    </ng-container>
  </div>
</div>
