<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Admin</small>
      <h2 class="h3 mb-0">Detalle notificacion</h2>
    </div>
    <a routerLink="/admin/notificaciones" class="btn btn-outline-primary rounded-pill px-4">Volver</a>
  </div>

  <div class="app-panel-body">
    <app-error-alert [message]="error"></app-error-alert>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>
    <app-loading *ngIf="loading" text="Cargando notificacion..."></app-loading>

    <ng-container *ngIf="!loading && item as notificacion">
      <div class="app-badge-row mb-4">
        <span class="badge bg-light text-dark border">{{ notificacion.canal || 'Interna' }}</span>
        <span class="badge" [ngClass]="estadoClass(notificacion.estado)">{{ notificacion.estado || 'Pendiente' }}</span>
        <span class="badge" [ngClass]="notificacion.activa === false ? 'bg-secondary' : 'bg-success'">{{ notificacion.activa === false ? 'Inactiva' : 'Activa' }}</span>
      </div>

      <div class="admin-detail-summary mb-4">
        <div *ngFor="let entry of entries; trackBy: trackByKey">
          <span>{{ entry.key }}</span>
          <strong class="text-break">{{ entry.value }}</strong>
        </div>
      </div>

      <div class="app-actions">
        <button type="button" class="btn btn-primary rounded-pill px-4" [disabled]="actionLoading" (click)="reenviar()">Reenviar</button>
        <button type="button" class="btn btn-outline-danger rounded-pill px-4" [disabled]="actionLoading" (click)="cancelar()">Cancelar</button>
      </div>
    </ng-container>
  </div>
</div>
