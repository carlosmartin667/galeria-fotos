<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Admin</small>
      <h2 class="h3 mb-0">Mi perfil publico</h2>
    </div>
    <a routerLink="/admin/perfil-publico" class="btn btn-outline-primary rounded-pill px-4">Ver publico</a>
  </div>

  <div class="app-panel-body">
    <app-error-alert [message]="error"></app-error-alert>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>
    <app-loading *ngIf="loading"></app-loading>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="row g-3" novalidate>
      <div class="col-md-6">
        <label class="form-label" for="adminNombre">Nombre</label>
        <input id="adminNombre" type="text" class="form-control" formControlName="nombre">
        <small *ngIf="showError('nombre')" class="text-danger">El nombre es requerido.</small>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="adminCorreo">Correo publico</label>
        <input id="adminCorreo" type="email" class="form-control" formControlName="correoPublico">
        <small *ngIf="showError('correoPublico')" class="text-danger">Ingresa un email valido.</small>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="adminWhatsapp">WhatsApp</label>
        <input id="adminWhatsapp" type="text" class="form-control" formControlName="whatsApp">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="adminInstagram">Instagram</label>
        <input id="adminInstagram" type="text" class="form-control" formControlName="instagram">
      </div>
      <div class="col-12">
        <label class="form-label" for="adminDireccion">Direccion</label>
        <input id="adminDireccion" type="text" class="form-control" formControlName="direccion">
      </div>
      <div class="col-12">
        <label class="form-label" for="adminDescripcion">Descripcion</label>
        <textarea id="adminDescripcion" rows="5" class="form-control" formControlName="descripcion"></textarea>
      </div>
      <div class="col-12 app-actions">
        <button type="submit" class="btn btn-primary rounded-pill px-4" [disabled]="saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
          Guardar perfil
        </button>
      </div>
    </form>
  </div>
</div>
