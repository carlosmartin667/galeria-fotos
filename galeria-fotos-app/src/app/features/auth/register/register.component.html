<div class="auth-page">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h1 class="text-primary mb-1">Crear cuenta</h1>
      <p class="text-muted mb-0">Registrate para gestionar la galeria</p>
    </div>

    <app-error-alert [message]="error"></app-error-alert>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="registerNombre">Nombre</label>
        <input id="registerNombre" type="text" class="form-control" formControlName="nombre" autocomplete="name">
        <small *ngIf="showError('nombre')" class="text-danger">El nombre es requerido.</small>
      </div>

      <div class="mb-3">
        <label class="form-label" for="registerEmail">Email</label>
        <input id="registerEmail" type="email" class="form-control" formControlName="email" autocomplete="email">
        <small *ngIf="showError('email')" class="text-danger">Ingresa un email valido.</small>
      </div>

      <div class="mb-3">
        <label class="form-label" for="registerPassword">Password</label>
        <input id="registerPassword" type="password" class="form-control" formControlName="password" autocomplete="new-password">
        <small *ngIf="showError('password')" class="text-danger">La password debe tener al menos 8 caracteres.</small>
      </div>

      <div class="mb-4">
        <label class="form-label" for="registerConfirm">Confirmar password</label>
        <input id="registerConfirm" type="password" class="form-control" formControlName="confirmPassword" autocomplete="new-password">
        <small *ngIf="form.hasError('passwordsMismatch') && (form.touched || submitted)" class="text-danger">Las passwords no coinciden.</small>
      </div>

      <button type="submit" class="btn btn-primary rounded-pill w-100 mb-3" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Crear cuenta
      </button>

      <a routerLink="/login" class="btn btn-outline-dark rounded-pill w-100">Volver al login</a>
    </form>
  </div>
</div>
