<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Fotos</small>
      <h2 class="h3 mb-0">Fotos por evento</h2>
    </div>
    <a *ngIf="session.isAdmin && eventoId" [routerLink]="['/fotos/metadata']" [queryParams]="{ eventoId: eventoId }" class="btn btn-primary rounded-pill px-4">Crear metadata</a>
  </div>

  <div class="app-panel-body">
    <div class="row g-3 align-items-end mb-4">
      <div class="col-md-9">
        <label class="form-label" for="eventoIdSearch">Evento ID</label>
        <input id="eventoIdSearch" type="text" class="form-control" [value]="eventoId" placeholder="UUID del evento" #eventoInput>
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-primary rounded-pill w-100" (click)="searchByValue(eventoInput.value)">Buscar</button>
      </div>
    </div>

    <app-error-alert [message]="error"></app-error-alert>
    <app-loading *ngIf="loading"></app-loading>
    <app-empty-state *ngIf="!loading && fotos.length === 0" text="No hay fotos para mostrar."></app-empty-state>

    <div *ngIf="!loading && fotos.length > 0" class="photo-grid">
      <article *ngFor="let foto of fotos; trackBy: trackById" class="photo-card">
        <img *ngIf="foto.previewUrl" [src]="foto.previewUrl" [alt]="foto.nombreArchivo">
        <div *ngIf="!foto.previewUrl" class="photo-placeholder"><i class="fas fa-image"></i></div>
        <div class="p-3">
          <h3 class="h6 mb-2 text-break">{{ foto.nombreArchivo }}</h3>
          <p class="mb-1"><strong>Precio:</strong> {{ foto.precioUnitario ?? 0 | currency }}</p>
          <p class="mb-3"><strong>Activa:</strong> {{ foto.activa === false ? 'No' : 'Si' }}</p>
          <div class="app-actions">
            <a [routerLink]="['/fotos', foto.id]" class="btn btn-sm btn-primary rounded-pill">Ver detalle</a>
            <ng-container *ngIf="session.isAdmin">
            <a [routerLink]="['/fotos/editar', foto.id]" class="btn btn-sm btn-outline-primary rounded-pill">Editar metadata</a>
            <button type="button" class="btn btn-sm btn-outline-danger rounded-pill" (click)="deleteFoto(foto)">Eliminar</button>
            </ng-container>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
