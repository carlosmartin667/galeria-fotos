<div class="app-panel">
  <div class="app-panel-header">
    <div>
      <small class="app-kicker">Pedidos</small>
      <h2 class="h3 mb-0">Listado</h2>
    </div>
    <a *ngIf="session.canWrite" routerLink="/pedidos/nuevo" class="btn btn-primary rounded-pill px-4">Nuevo pedido</a>
  </div>

  <div class="app-panel-body">
    <app-error-alert [message]="error"></app-error-alert>
    <app-loading *ngIf="loading"></app-loading>
    <app-empty-state *ngIf="!loading && pedidos.length === 0" text="No hay pedidos para mostrar."></app-empty-state>

    <div *ngIf="!loading && pedidos.length > 0" class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Evento</th>
            <th>Cliente</th>
            <th>Estado</th>
            <th>Total</th>
            <th>Creado</th>
            <th>Detalle</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pedido of pedidos; trackBy: trackById">
            <td class="text-break">{{ pedido.id }}</td>
            <td class="text-break">{{ pedido.eventoId }}</td>
            <td class="text-break">{{ pedido.clienteId }}</td>
            <td>{{ pedido.estado || '-' }}</td>
            <td>{{ pedido.total ?? 0 | currency }}</td>
            <td>{{ pedido.fechaCreacionUtc ? (pedido.fechaCreacionUtc | date:'short') : '-' }}</td>
            <td><a [routerLink]="['/pedidos', pedido.id]" class="btn btn-sm btn-outline-primary rounded-pill">Ver detalle</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
